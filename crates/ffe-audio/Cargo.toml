[package]
name = "ffe-audio"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "HMP music and effect playback for the First Encounters rewrite"

[dependencies]
ffe-core = { path = "../ffe-core" }
oxisynth = "0.1.0"
sha2 = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
cpal = "0.18.2"

[dev-dependencies]
tempfile = "3"
